name: Repair YEKDB v1.0.14 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-v1.0.14-tag.yml

permissions:
  contents: write

jobs:
  repair-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Point v1.0.14 at the verified build commit
        shell: bash
        run: |
          target=5a29e2b159262247816c1185dbc78a54b82a3103
          test "$(git cat-file -t "$target")" = commit
          git tag -f v1.0.14 "$target"
          git push origin --force refs/tags/v1.0.14
          test "$(git ls-remote origin refs/tags/v1.0.14 | cut -f1)" = "$target"
