name: Release YEKDB v1.0.14

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.14.yml

permissions:
  contents: write

env:
  VERSION: 1.0.14

jobs:
  test-core:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run 2,048 core tests
        shell: bash
        run: |
          chmod +x yekdb-launcher/mvnw
          ./yekdb-launcher/mvnw -B -f pom.xml test

  build-windows:
    name: Windows x64 package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Windows installer
        shell: pwsh
        run: ./yekdb-launcher/scripts/build-windows.ps1 -Version $env:VERSION
      - name: Create Windows checksum
        shell: pwsh
        run: |
          $asset = "yekdb-launcher/dist/YEKDB-Setup-$env:VERSION.exe"
          $checksum = "yekdb-launcher/dist/SHA256SUMS-$env:VERSION.txt"
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksum, "$hash  $([IO.Path]::GetFileName($asset))`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            yekdb-launcher/dist/YEKDB-Setup-1.0.14.exe
            yekdb-launcher/dist/SHA256SUMS-1.0.14.txt
          if-no-files-found: error

  build-macos:
    name: macOS arm64 package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Apple Silicon DMG
        shell: bash
        run: |
          chmod +x yekdb-launcher/mvnw yekdb-launcher/scripts/build-macos.sh
          ./yekdb-launcher/scripts/build-macos.sh "$VERSION"
      - name: Create macOS checksum
        shell: bash
        run: |
          cd yekdb-launcher/dist
          shasum -a 256 "YEKDB-$VERSION-arm64.dmg" > "SHA256SUMS-macOS-$VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            yekdb-launcher/dist/YEKDB-1.0.14-arm64.dmg
            yekdb-launcher/dist/SHA256SUMS-macOS-1.0.14.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - test-core
      - build-windows
      - build-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          cd dist
          sha256sum -c "SHA256SUMS-$VERSION.txt"
          sha256sum -c "SHA256SUMS-macOS-$VERSION.txt"
      - name: Publish v1.0.14
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test ! -e "dist/YEKDB-Setup-$VERSION.exe.part"
          test ! -e "dist/YEKDB-$VERSION-arm64.dmg.part"
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "YEKDB v$VERSION — Core Stabilization & macOS Updates" \
            --notes-file "docs/Releases/YEKDB_1.0.14_Release_Notes.md" \
            --latest
